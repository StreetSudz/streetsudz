<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Street Sudz - Mobile Car Wash & Detailing. Professional, reliable and affordable car washing and detailing services.">
    <meta name="theme-color" content="#000000">
    <title>Street Sudz | Mobile Car Wash & Detailing</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .flyer-container {
            width: 100%;
            max-width: 1536px;
            line-height: 0;
        }

        .flyer {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            .flyer-container {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="flyer-container">
        <img
            class="flyer"
            src="streetsudz-flyer.png"
            alt="Street Sudz Mobile Car Wash and Detailing - Professional, Reliable, Affordable"
        >
    </main>
</body>
</html>
